# The name is what README's badge reads, so it says what the workflow
# proves rather than that it exists.
name: "build & test"

# This repository had no CI by design, so every job below is the same command
# CLAUDE.md ("Commands") tells a human to run by hand — nothing here checks
# something you cannot reproduce locally in one line.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The matrix is only meaningful if the Go it selects is the Go that runs.
  # Left on auto, a toolchain line anywhere in the graph lets the 1.21 job
  # download something newer and the go.mod floor stops being tested at all.
  GOTOOLCHAIN: local

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows would otherwise get pwsh, and the point of that job is to
        # test this code on Windows, not to test a second shell dialect.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # The go.mod floor. It builds and tests here or the floor is a
          # fiction; `stdversion` does not exist in this toolchain, which is
          # why the newest one below is the job that catches a post-1.21
          # stdlib symbol.
          - {os: ubuntu-latest, go: "1.21.x"}
          - {os: ubuntu-latest, go: "oldstable"}
          # The newest toolchain is where the standard library can move
          # underneath this code: json/v2 as the engine under the v1 API, and
          # the timer-channel semantics sender.go documents.
          - {os: ubuntu-latest, go: "stable"}
          # The library is pure Go, but the suite is timing- and
          # concurrency-shaped. Two more platforms is how that stays true
          # somewhere other than Linux.
          - {os: macos-latest, go: "stable"}
          - {os: windows-latest, go: "stable"}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Build
        run: go build ./...

      # Not optional: go.mod declares go 1.21 and the compiler will happily
      # build a newer stdlib symbol. Only vet's stdversion analyzer says no,
      # and only on a toolchain that has it.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # Pinned, and to the same version the .golangci.yml header is written
      # against: a linter that updates itself turns an unrelated pull request
      # red for a rule nobody chose to adopt yet. Dependabot cannot bump this
      # one, so it is a deliberate manual edit.
      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: v2.12.2
        run: |
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/install.sh" |
            sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The config is v2 schema and hand-maintained; verify it before trusting
      # a clean run from it.
      - name: Verify config
        run: golangci-lint config verify

      - name: Lint
        run: golangci-lint run ./...

      # gofumpt -extra plus goimports. The repository formats clean, so any
      # output at all is a regression — but `fmt --diff` prints the diff
      # rather than failing, so the emptiness is what gets asserted.
      - name: Formatting
        run: |
          diff=$(golangci-lint fmt --diff ./... || true)
          if [ -n "$diff" ]; then
            printf '%s\n' "$diff"
            echo "::error::golangci-lint fmt reports changes; run 'golangci-lint fmt ./...'"
            exit 1
          fi

      # go.sum drift is invisible in review and only bites the next person to
      # run a build. The module has one test-only dependency, so this is a
      # no-op until it is not.
      - name: Tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # The workflow default is read-only. This job alone needs write, and only
    # to force-push the rendered badge onto the orphan `badges` branch below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # example/ is excluded deliberately. It is documentation with no tests,
      # and including it drags the reported total from ~98.7% to ~88.7% —
      # a number that says nothing about the library. COVERAGE.md accounts for
      # every block the library still misses.
      - name: Test with coverage
        run: go test -race -coverprofile=cover.out -covermode=atomic $(go list ./... | grep -v '/example$')

      - name: Report
        run: go tool cover -func=cover.out

      # A floor, not a target. Coverage sits at ~98.7% and the remaining
      # blocks are unreachable rather than untested, so this only fires when a
      # feature lands with no test at all.
      - name: Enforce floor
        id: floor
        env:
          MINIMUM: "97.0"
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $NF}' | tr -d '%')
          echo "total coverage: ${total}% (floor ${MINIMUM}%)"
          echo "### Coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          echo "total=${total}" >> "$GITHUB_OUTPUT"
          if awk -v t="$total" -v m="$MINIMUM" 'BEGIN { exit !(t + 0 < m + 0) }'; then
            echo "::error::coverage ${total}% is below the ${MINIMUM}% floor"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: cover.out
          if-no-files-found: error

      # README's badges, rendered from what this job already knows and served
      # by GitHub. A coverage service would report the same figure and want an
      # account, a token and a webhook for it; this is the figure, drawn in
      # fifteen lines of SVG. It is deliberately not a shields endpoint either
      # — that would still put a third party between the README and its own
      # build. The Go badge goes the same way rather than being a static image
      # somebody has to remember to redraw: it reads go.mod, so raising the
      # floor raises the badge in the same commit.
      #
      # The branch is orphaned and force-pushed, so it stays one commit holding
      # two files and never grows. Pushing to it cannot retrigger this
      # workflow: `on.push.branches` is main and tags only.
      - name: Publish the badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOTAL: ${{ steps.floor.outputs.total }}
        run: |
          work=$(mktemp -d)

          # One flat badge: label, message, colour, output path. Verdana at
          # 11px runs about 7px a character, which is what sizes each half.
          # The heredoc below is written at this block's own indentation and
          # not the function body's, because YAML strips exactly that much —
          # which is what leaves EOF in column zero, where sh needs it.
          badge() {
            lw=$(( ${#1} * 7 + 14 ))
            mw=$(( ${#2} * 7 + 14 ))
            w=$(( lw + mw ))
            lx=$(( lw * 5 ))
            mx=$(( (lw + mw / 2) * 10 ))
            cat > "$4" <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="$w" height="20" role="img" aria-label="$1: $2">
          <title>$1: $2</title>
          <linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient>
          <clipPath id="r"><rect width="$w" height="20" rx="3" fill="#fff"/></clipPath>
          <g clip-path="url(#r)">
          <rect width="$lw" height="20" fill="#555"/>
          <rect x="$lw" width="$mw" height="20" fill="$3"/>
          <rect width="$w" height="20" fill="url(#s)"/>
          </g>
          <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
          <text transform="scale(.1)" x="$lx" y="150" fill="#010101" fill-opacity=".3">$1</text>
          <text transform="scale(.1)" x="$lx" y="140">$1</text>
          <text transform="scale(.1)" x="$mx" y="150" fill="#010101" fill-opacity=".3">$2</text>
          <text transform="scale(.1)" x="$mx" y="140">$2</text>
          </g>
          </svg>
          EOF
          }

          color=$(awk -v t="$TOTAL" 'BEGIN {
            if (t + 0 >= 95) print "#4c1";
            else if (t + 0 >= 85) print "#97ca00";
            else if (t + 0 >= 70) print "#dfb317";
            else print "#e05d44";
          }')
          badge coverage "${TOTAL}%" "$color" "$work/coverage.svg"

          # The floor go.mod actually declares, not a number typed twice.
          floor=$(awk '$1 == "go" { print $2; exit }' go.mod)
          badge go "${floor}+" "#00ADD8" "$work/go.svg"

          cd "$work"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.svg go.svg
          git commit -qm "coverage: ${TOTAL}%, go: ${floor}+"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # A smoke test, not a measurement: shared runners cannot produce numbers
      # worth comparing. -benchtime 10x keeps it to seconds, and what it
      # catches is a benchmark that stopped compiling or started panicking —
      # which `go test ./...` never runs and so never notices.
      - name: Run benchmarks
        run: go test -run '^$' -bench . -benchmem -benchtime 10x ./...

  unlinked:
    name: fastjson stays unlinked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # The whole point of fastjson being a subpackage: a binary that does not
      # opt in must not link it (CLAUDE.md, Architecture; DESIGN §4). An
      # accidental import in the root package is invisible in review and
      # silently costs every user the trust argument the seam exists to avoid.
      - name: Build the example
        run: go build -o example.bin ./example

      - name: No fastjson in the dependency graph
        run: |
          if go list -deps ./example | grep -q '/fastjson$'; then
            go list -deps ./example | grep '/fastjson$'
            echo "::error::example imports fastjson; the opt-in encoder must stay opt-in"
            exit 1
          fi

      - name: No fastjson symbols in the binary
        run: |
          if go tool nm example.bin | grep -q 'fastjson'; then
            go tool nm example.bin | grep 'fastjson' | head
            echo "::error::fastjson symbols linked into a binary that never asked for them"
            exit 1
          fi
